name: Sync upstream PonWrt

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch upstream and branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pbs05/ponwrt.git
          git fetch upstream +refs/heads/master:refs/remotes/upstream/master --tags
          git fetch origin +refs/heads/master:refs/remotes/origin/master +refs/heads/pku-mirror:refs/remotes/origin/pku-mirror

      - name: Merge upstream into master
        run: |
          git checkout -B master origin/master
          git merge upstream/master -m "Merge upstream ponwrt $(git rev-parse --short upstream/master)"
          # GITHUB_TOKEN cannot push workflow changes; keep this branch's workflows
          git checkout origin/master -- .github/workflows
          git commit --amend --no-edit
          git push origin master

      - name: Merge upstream into pku-mirror
        run: |
          git checkout -B pku-mirror origin/pku-mirror
          git merge upstream/master -m "Merge upstream ponwrt into pku-mirror ($(git rev-parse --short upstream/master))"
          git checkout origin/pku-mirror -- .github/workflows
          git commit --amend --no-edit
          git push origin pku-mirror
